name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest-9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update models API catalog
        run: pnpm run update:models-api
        continue-on-error: true

      - name: Check models API catalog
        run: pnpm run test:models-api

      - name: Lint
        run: pnpm run lint

      - name: Build plugin
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Check build artifacts
        run: |
          if [ ! -f main.js ] || [ ! -f manifest.json ] || [ ! -f styles.css ]; then
            echo "Error: Required build artifacts not found"
            exit 1
          fi
          echo "Build successful! All required files generated."
