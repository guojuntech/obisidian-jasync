name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const manifest = read('manifest.json')
          const pkg = read('package.json')
          const versions = read('versions.json')
          const tag = process.env.GITHUB_REF_NAME
          if (manifest.id !== 'jasync' || manifest.version !== tag || pkg.version !== tag || versions[tag] !== manifest.minAppVersion) {
            throw new Error('Release tag, plugin identity and version files must agree')
          }
          readFileSync(`docs/releases/${tag}.md`, 'utf8')
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Build plugin
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Verify installation archive
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { unzipSync } from 'fflate'
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'))
          const archive = unzipSync(readFileSync(`dist/jasync-${manifest.version}.zip`))
          const files = ['main.js', 'manifest.json', 'styles.css', 'LICENSE', 'NOTICE.md']
          if (Object.keys(archive).length !== files.length) throw new Error('Unexpected archive contents')
          for (const file of files) {
            const data = archive[`jasync/${file}`]
            if (!data || !Buffer.from(data).equals(readFileSync(`dist/${file}`))) {
              throw new Error(`Archive does not match release asset: ${file}`)
            }
          }
          NODE

      - name: Generate checksums
        working-directory: dist
        run: sha256sum main.js manifest.json styles.css LICENSE NOTICE.md "jasync-${GITHUB_REF_NAME}.zip" > SHA256SUMS

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" \
            --verify-tag \
            --title="$tag" \
            --notes-file="docs/releases/${tag}.md" \
            dist/main.js dist/manifest.json dist/styles.css \
            "dist/jasync-${tag}.zip" \
            dist/LICENSE dist/NOTICE.md dist/SHA256SUMS
